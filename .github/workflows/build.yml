name: Build and compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\LaVolpe.Buttons.Net.sln

      - name: Build solution
        run: dotnet build .\LaVolpe.Buttons.Net.sln -c Release --no-restore -m:1

      - name: Run compatibility harness
        run: dotnet run --project .\LaVolpe.Buttons.Tests\LaVolpe.Buttons.Tests.csproj -c Release --no-build
